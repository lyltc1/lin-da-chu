<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大厨手记 · 菜谱编辑器</title>
<style>
  :root {
    --brand: #FF7043;
    --brand-dark: #E64A19;
    --bg: #F7F5F2;
    --panel: #FFFFFF;
    --line: #E4DFD8;
    --text: #2C2825;
    --muted: #8A817A;
    --ok: #2E7D32;
    --err: #C62828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    display: flex; flex-direction: column;
  }

  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand span { color: var(--brand); }
  .conn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .conn input {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 13px; font-family: inherit; background: #fff;
  }
  #token { width: 240px; }
  #owner { width: 90px; }
  #repo { width: 150px; }
  .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    border-radius: 6px; border: 1px solid var(--line);
    padding: 6px 12px; background: #fff; color: var(--text);
  }
  button:hover { border-color: var(--brand); color: var(--brand-dark); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--brand-dark); color: #fff; }
  button.primary:disabled { background: #D8CFC8; border-color: #D8CFC8; cursor: default; color: #fff; }
  button.mini { padding: 2px 7px; font-size: 12px; line-height: 1.5; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .status { font-size: 13px; color: var(--muted); max-width: 420px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  main { flex: 1; display: flex; min-height: 0; }

  aside.sidebar {
    width: 280px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .side-search { padding: 10px; border-bottom: 1px solid var(--line); }
  .side-search input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 9px; font-size: 13px; font-family: inherit;
  }
  #list { overflow-y: auto; flex: 1; }
  .item {
    padding: 9px 12px; border-bottom: 1px solid #F0ECE7; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .item:hover { background: #FBF8F5; }
  .item.active { background: #FFF1EC; box-shadow: inset 3px 0 0 var(--brand); }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; }
  .tag-del { font-size: 11px; color: var(--err); border: 1px solid var(--err); border-radius: 4px; padding: 0 4px; }

  section.editor { flex: 1; overflow-y: auto; padding: 18px 22px 60px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  h2.sec {
    font-size: 13px; font-weight: 700; margin: 22px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  h2.sec:first-child { margin-top: 0; }
  h2.sec .hint { font-weight: 400; color: var(--muted); font-size: 12px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
    font-size: 13px; font-family: inherit; background: #fff; color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 62px; line-height: 1.6; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--brand);
  }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 0 6px 6px; }
  td { padding: 3px 6px; vertical-align: middle; }
  td input, td select {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 13px; font-family: inherit;
  }
  td input:focus, td select:focus { outline: none; border-color: var(--brand); }
  td.ops { width: 130px; white-space: nowrap; }
  td.ops button { margin-right: 3px; }

  .step {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; background: #fff;
  }
  .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .step-no {
    width: 24px; height: 24px; border-radius: 50%; background: var(--brand);
    color: #fff; font-size: 12px; display: flex; align-items: center;
    justify-content: center; flex: none; font-weight: 600;
  }
  .step-head input { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 13px; font-family: inherit; }
  .step textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font-size: 13px; font-family: inherit;
    resize: vertical; min-height: 58px; line-height: 1.6;
  }
  .step-foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .step-foot input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit; }
  .step-foot .grow { flex: 1; }
  .step input:focus, .step textarea:focus { outline: none; border-color: var(--brand); }

  .row-actions { margin-top: 8px; display: flex; gap: 8px; }
  .cover-preview { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .cover-preview img { max-width: 160px; max-height: 110px; border-radius: 8px; display: block; margin-top: 6px; border: 1px solid var(--line); }
  .warn { background: #FFF8E1; border: 1px solid #FFE082; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">大厨手记 · <span>菜谱编辑器</span></div>
  <div class="conn">
    <input id="token" type="password" placeholder="GitHub 令牌" autocomplete="off">
    <input id="owner" placeholder="owner" autocomplete="off">
    <input id="repo" placeholder="repo" autocomplete="off">
    <button id="btnConnect">连接</button>
  </div>
  <span id="status" class="status"></span>
  <div class="spacer"></div>
  <button id="btnNew">新建菜谱</button>
  <button id="btnSaveAll" class="primary" disabled>保存全部更改</button>
</header>

<main>
  <aside class="sidebar">
    <div class="side-search">
      <input id="search" placeholder="搜索菜名 / 别名…">
    </div>
    <div id="list"></div>
  </aside>
  <section class="editor" id="editor">
    <div class="empty">填入令牌后点「连接」，即可编辑仓库里的菜谱。</div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const LS_KEY = "lindachu.editor.config";
  const GROUPS = ["主料", "辅料", "调料"];
  const CAT_NAMES = {
    "c-home": "素菜",
    "c-meat": "肉菜",
    "c-seafood": "海鲜",
    "c-soup": "汤"
  };

  // 仓库名是固定的，预填省得每次敲；令牌只存在本机 localStorage
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
  const cfg = {
    token: saved.token || "",
    owner: saved.owner || "lyltc1",
    repo: saved.repo || "lin-da-chu-data"
  };

  let indexSha = null;
  let indexData = null;
  const recipes = new Map(); // id -> { data, sha, dirty, isNew }
  let currentId = null;

  /* ---------- 工具 ---------- */

  function saveCfg() { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }

  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin);
  }

  function b64decode(b64) {
    const bin = atob(b64.replace(/\s/g, ""));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function fileToB64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = () => reject(new Error("读取文件失败"));
      reader.readAsDataURL(file);
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function fmtTime(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function status(text, kind) {
    const el = $("#status");
    el.textContent = text || "";
    el.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------- GitHub Contents API ---------- */

  async function gh(path, method, body) {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
    const res = await fetch(url, {
      method: method || "GET",
      headers: Object.assign(
        {
          Authorization: `Bearer ${cfg.token}`,
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        },
        body ? { "Content-Type": "application/json; charset=utf-8" } : {}
      ),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 404) return null;
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
    return json;
  }

  async function readFile(path) {
    const r = await gh(path);
    if (!r || !r.content) return null;
    return { content: b64decode(r.content), sha: r.sha };
  }

  async function writeFile(path, content, message, sha, isBinary) {
    const body = { message, content: isBinary ? content : b64encode(content) };
    if (sha) body.sha = sha;
    const r = await gh(path, "PUT", body);
    return r && r.content ? r.content.sha : sha;
  }

  /* ---------- 载入 ---------- */

  async function connect() {
    cfg.token = $("#token").value.trim();
    cfg.owner = $("#owner").value.trim();
    cfg.repo = $("#repo").value.trim();
    if (!cfg.token || !cfg.owner || !cfg.repo) {
      status("请填令牌、owner、repo", "err");
      return;
    }
    saveCfg();
    status("正在读取仓库…");
    try {
      const f = await readFile("index.json");
      if (!f) {
        status("仓库里还没有 index.json，先在手机上同步一次", "err");
        return;
      }
      indexSha = f.sha;
      indexData = JSON.parse(f.content);
      recipes.clear();
      currentId = null;
      $("#editor").innerHTML = '<div class="empty">从左边选一道菜开始编辑。</div>';
      renderList();
      updateSaveBtn();
      status(`已连接：${indexData.dishes.length} 道菜`, "ok");
    } catch (e) {
      status("连接失败：" + e.message, "err");
    }
  }

  async function openRecipe(id) {
    status("正在读取菜谱…");
    try {
      if (!recipes.has(id)) {
        const f = await readFile(`recipes/${id}.json`);
        if (!f) { status(`recipes/${id}.json 不存在`, "err"); return; }
        recipes.set(id, { data: JSON.parse(f.content), sha: f.sha, dirty: false });
      }
      currentId = id;
      renderList();
      renderEditor();
      status("");
    } catch (e) {
      status("读取失败：" + e.message, "err");
    }
  }

  /* ---------- 渲染：列表 ---------- */

  function visibleDishes() {
    const q = $("#search").value.trim().toLowerCase();
    return (indexData.dishes || [])
      .filter((d) => {
        if (!q) return true;
        const r = recipes.get(d.id);
        const hay = `${d.title} ${r ? r.data.aliases || "" : ""}`.toLowerCase();
        return hay.includes(q);
      })
      .slice()
      .sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function renderList() {
    const list = $("#list");
    if (!indexData) { list.innerHTML = ""; return; }
    const dishes = visibleDishes();
    list.innerHTML = dishes.map((d) => {
      const rec = recipes.get(d.id);
      const cls = d.id === currentId ? "item active" : "item";
      const dot = rec && rec.dirty ? '<i class="dot" title="有未保存的更改"></i>' : "";
      const del = d.deleted ? '<span class="tag-del">已删</span>' : "";
      return `<div class="${cls}" data-open="${esc(d.id)}">
        ${dot}<div class="t">${esc(d.title || d.id)}</div>${del}
        <div class="meta">${fmtTime(d.updatedAt)}</div>
      </div>`;
    }).join("") || '<div class="empty">没有匹配的菜谱</div>';
  }

  /* ---------- 渲染：编辑区 ---------- */

  function categoryOptions(selected) {
    const ids = new Set(["c-home", "c-meat", "c-seafood", "c-soup"]);
    for (const rec of recipes.values()) {
      if (rec.data.categoryId) ids.add(rec.data.categoryId);
    }
    const opts = Array.from(ids).map((id) => {
      const label = CAT_NAMES[id] || id;
      return `<option value="${esc(id)}"${id === selected ? " selected" : ""}>${esc(label)}</option>`;
    });
    const known = Array.from(ids).includes(selected);
    if (selected && !known) opts.push(`<option value="${esc(selected)}" selected>${esc(selected)}</option>`);
    return opts.join("");
  }

  function renderEditor() {
    const rec = recipes.get(currentId);
    if (!rec) { $("#editor").innerHTML = '<div class="empty">从左边选一道菜。</div>'; return; }
    const d = rec.data;
    const ing = d.ingredients || (d.ingredients = []);
    const steps = d.steps || (d.steps = []);

    const ratingOpts = [0, 1, 2, 3, 4, 5].map((v) =>
      `<option value="${v}"${d.rating === v ? " selected" : ""}>${v === 0 ? "未评分" : v + " 星"}</option>`).join("");

    const ingRows = ing.map((it, i) => `
      <tr>
        <td style="width:92px"><select data-ing="${i}" data-k="group">
          ${GROUPS.map((g) => `<option${it.group === g ? " selected" : ""}>${g}</option>`).join("")}
        </select></td>
        <td><input data-ing="${i}" data-k="name" value="${esc(it.name)}" placeholder="食材名"></td>
        <td style="width:120px"><input data-ing="${i}" data-k="amount" value="${esc(it.amount)}" placeholder="用量"></td>
        <td style="width:80px"><input data-ing="${i}" data-k="unit" value="${esc(it.unit)}" placeholder="单位"></td>
        <td class="ops">
          <button class="mini" data-act="ing-up" data-i="${i}">↑</button>
          <button class="mini" data-act="ing-down" data-i="${i}">↓</button>
          <button class="mini" data-act="ing-dup" data-i="${i}">复制</button>
          <button class="mini danger" data-act="ing-del" data-i="${i}">✕</button>
        </td>
      </tr>`).join("");

    const stepCards = steps.map((s, i) => `
      <div class="step">
        <div class="step-head">
          <div class="step-no">${i + 1}</div>
          <input data-step="${i}" data-k="summary" value="${esc(s.summary)}" placeholder="步骤小结，如 热油">
          <button class="mini" data-act="step-up" data-i="${i}">↑</button>
          <button class="mini" data-act="step-down" data-i="${i}">↓</button>
          <button class="mini danger" data-act="step-del" data-i="${i}">✕</button>
        </div>
        <textarea data-step="${i}" data-k="text" placeholder="这一步怎么做">${esc(s.text)}</textarea>
        <div class="step-foot">
          <span style="font-size:12px;color:var(--muted)">图片</span>
          <input class="grow" data-step="${i}" data-k="image0" value="${esc((s.images || [])[0] || "")}" placeholder="images/… 留空表示无图">
          <button class="mini" data-act="step-img" data-i="${i}">上传</button>
          <span style="font-size:12px;color:var(--muted)">计时</span>
          <input style="width:70px" data-step="${i}" data-k="timerSec" value="${s.timerSec ? s.timerSec : ""}" placeholder="秒">
        </div>
      </div>`).join("");

    $("#editor").innerHTML = `
      ${d.deletedAt ? '<div class="warn">这道菜已标记删除（手机同步后会移除）。清空删除标记可恢复。</div>' : ""}

      <h2 class="sec">基本信息 <span class="hint">id：${esc(d.id)}</span></h2>
      <div class="card grid">
        <div class="field wide">
          <label>菜名</label>
          <input data-field="title" value="${esc(d.title)}">
        </div>
        <div class="field">
          <label>分类</label>
          <select data-field="categoryId">${categoryOptions(d.categoryId || "")}</select>
        </div>
        <div class="field">
          <label>耗时（分钟）</label>
          <input type="number" data-field="durationMin" value="${d.durationMin || 0}">
        </div>
        <div class="field">
          <label>评分</label>
          <select data-field="rating">${ratingOpts}</select>
        </div>
        <div class="field wide">
          <label>标签（逗号分隔，如 快手,素菜）</label>
          <input data-field="tags" value="${esc(d.tags || "")}">
        </div>
        <div class="field wide">
          <label>别名（逗号分隔，只参与搜索）</label>
          <input data-field="aliases" value="${esc(d.aliases || "")}">
        </div>
      </div>

      <h2 class="sec">封面图</h2>
      <div class="card">
        <div class="field">
          <label>路径</label>
          <input data-field="coverPath" value="${esc(d.coverPath || "")}" placeholder="images/${esc(d.id)}/cover.jpg">
        </div>
        <div class="row-actions">
          <button data-act="cover-upload">上传新封面</button>
          <button class="danger" data-act="cover-clear">清除封面</button>
        </div>
        <div class="cover-preview">${d.coverPath ? "当前：" + esc(d.coverPath) : "未设置封面"}</div>
      </div>

      <h2 class="sec">食材 <span class="hint">共 ${ing.length} 条</span></h2>
      <div class="card">
        <table>
          <thead><tr><th>分组</th><th>名称</th><th>用量</th><th>单位</th><th></th></tr></thead>
          <tbody>${ingRows || '<tr><td colspan="5" style="color:var(--muted)">还没有食材</td></tr>'}</tbody>
        </table>
        <div class="row-actions">
          <button data-act="ing-add">+ 添加食材</button>
          <button data-act="ing-sort">按分组排序</button>
        </div>
      </div>

      <h2 class="sec">做法 <span class="hint">共 ${steps.length} 步</span></h2>
      ${stepCards || '<div class="card" style="color:var(--muted)">还没有步骤</div>'}
      <div class="row-actions">
        <button data-act="step-add">+ 添加步骤</button>
      </div>

      <h2 class="sec">备注与评价</h2>
      <div class="card grid">
        <div class="field wide">
          <label>备注</label>
          <textarea data-field="notes">${esc(d.notes || "")}</textarea>
        </div>
        <div class="field wide">
          <label>整体评价</label>
          <textarea data-field="review">${esc(d.review || "")}</textarea>
        </div>
      </div>

      <h2 class="sec">其他</h2>
      <div class="card">
        <div class="row-actions">
          <button class="danger" data-act="toggle-delete">${d.deletedAt ? "恢复这道菜" : "删除这道菜"}</button>
          <span style="font-size:12px;color:var(--muted);align-self:center">
            创建 ${fmtTime(d.createdAt)} · 更新 ${fmtTime(d.updatedAt)} · 做过 ${d.cookCount || 0} 次
          </span>
        </div>
      </div>
    `;
  }

  /* ---------- 编辑交互 ---------- */

  function markDirty() {
    const rec = recipes.get(currentId);
    if (rec) rec.dirty = true;
    updateSaveBtn();
    renderList();
  }

  function updateSaveBtn() {
    let n = 0;
    for (const rec of recipes.values()) if (rec.dirty) n++;
    const btn = $("#btnSaveAll");
    btn.disabled = n === 0;
    btn.textContent = n ? `保存全部更改（${n}）` : "保存全部更改";
  }

  const NUM_FIELDS = new Set(["difficulty", "durationMin", "servings", "rating", "cookCount"]);

  $("#editor").addEventListener("input", (e) => {
    const el = e.target;
    const rec = recipes.get(currentId);
    if (!rec) return;
    const ds = el.dataset;

    if ("field" in ds) {
      const v = NUM_FIELDS.has(ds.field) ? (parseInt(el.value, 10) || 0) : el.value;
      rec.data[ds.field] = v;
      markDirty();
    } else if ("ing" in ds) {
      rec.data.ingredients[Number(ds.ing)][ds.k] = el.value;
      markDirty();
    } else if ("step" in ds) {
      const step = rec.data.steps[Number(ds.step)];
      if (ds.k === "image0") {
        step.images = el.value.trim() ? [el.value.trim()] : [];
      } else if (ds.k === "timerSec") {
        const n = parseInt(el.value, 10);
        step.timerSec = n > 0 ? n : undefined;
      } else {
        step[ds.k] = el.value;
      }
      markDirty();
    }
  });

  $("#editor").addEventListener("change", (e) => {
    // select 在部分浏览器只触发 change
    if (e.target.tagName === "SELECT") {
      e.target.dispatchEvent(new Event("input", { bubbles: true }));
    }
  });

  $("#editor").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const rec = recipes.get(currentId);
    if (!rec) return;
    const act = btn.dataset.act;
    const i = Number(btn.dataset.i);
    const d = rec.data;

    if (act === "ing-add") {
      d.ingredients.push({ name: "", amount: "", unit: "", group: "调料" });
    } else if (act === "ing-del") {
      d.ingredients.splice(i, 1);
    } else if (act === "ing-dup") {
      d.ingredients.splice(i + 1, 0, Object.assign({}, d.ingredients[i]));
    } else if (act === "ing-up" && i > 0) {
      const t = d.ingredients[i]; d.ingredients[i] = d.ingredients[i - 1]; d.ingredients[i - 1] = t;
    } else if (act === "ing-down" && i < d.ingredients.length - 1) {
      const t = d.ingredients[i]; d.ingredients[i] = d.ingredients[i + 1]; d.ingredients[i + 1] = t;
    } else if (act === "ing-sort") {
      d.ingredients.sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group));
    } else if (act === "step-add") {
      d.steps.push({ text: "", summary: "", images: [] });
    } else if (act === "step-del") {
      d.steps.splice(i, 1);
    } else if (act === "step-up" && i > 0) {
      const t = d.steps[i]; d.steps[i] = d.steps[i - 1]; d.steps[i - 1] = t;
    } else if (act === "step-down" && i < d.steps.length - 1) {
      const t = d.steps[i]; d.steps[i] = d.steps[i + 1]; d.steps[i + 1] = t;
    } else if (act === "cover-clear") {
      delete d.coverPath;
    } else if (act === "toggle-delete") {
      if (d.deletedAt) delete d.deletedAt;
      else d.deletedAt = Date.now();
    } else if (act === "cover-upload") {
      await pickAndUpload(`images/${d.id}/cover.jpg`, (p) => { d.coverPath = p; });
    } else if (act === "step-img") {
      const idx = i;
      await pickAndUpload(`images/${d.id}/s${idx + 1}.jpg`, (p) => {
        d.steps[idx].images = [p];
      });
    }
    markDirty();
    renderEditor();
  });

  async function pickAndUpload(defaultPath, apply) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const path = defaultPath.replace(/\.\w+$/, "." + ext);
      status("正在上传图片…");
      try {
        const b64 = await fileToB64(file);
        const existing = await readFile(path);
        await writeFile(path, b64, `chore: 上传菜谱图片 ${path}`, existing ? existing.sha : null, true);
        apply(path);
        markDirty();
        renderEditor();
        status("图片已上传：" + path, "ok");
      } catch (err) {
        status("上传失败：" + err.message, "err");
      }
    };
    input.click();
  }

  /* ---------- 保存 ---------- */

  async function saveAll() {
    const ids = [];
    for (const [id, rec] of recipes) if (rec.dirty) ids.push(id);
    if (!ids.length) return;
    const btn = $("#btnSaveAll");
    btn.disabled = true;
    try {
      for (const id of ids) {
        const rec = recipes.get(id);
        status(`正在保存 ${rec.data.title}…`);
        rec.data.updatedAt = Date.now();
        // 难度与份量已废弃，保存时顺手清掉旧数据里残留的这两个字段
        delete rec.data.difficulty;
        delete rec.data.servings;
        const text = JSON.stringify(rec.data, null, 2);
        rec.sha = await writeFile(
          `recipes/${id}.json`, text,
          `chore: 更新菜谱 ${rec.data.title}`, rec.sha
        );
        rec.dirty = false;
        rec.isNew = false;

        let entry = indexData.dishes.find((x) => x.id === id);
        if (!entry) {
          entry = { id, title: rec.data.title, updatedAt: 0, deleted: false, sha: "" };
          indexData.dishes.push(entry);
        }
        entry.title = rec.data.title;
        entry.updatedAt = rec.data.updatedAt;
        entry.sha = rec.sha;
        entry.deleted = !!rec.data.deletedAt;
      }
      indexData.updatedAt = Date.now();
      indexData.dishes.sort((a, b) => b.updatedAt - a.updatedAt);
      indexSha = await writeFile(
        "index.json", JSON.stringify(indexData, null, 2),
        "chore: 同步菜谱索引", indexSha
      );
      status(`已保存 ${ids.length} 道菜，去手机上点一次同步即可生效`, "ok");
      renderList();
      if (currentId) renderEditor();
    } catch (e) {
      status("保存失败：" + e.message, "err");
    }
    updateSaveBtn();
  }

  /* ---------- 新建 ---------- */

  async function newRecipe() {
    if (!indexData) { status("先连接仓库", "err"); return; }
    const id = prompt("新菜谱 id（字母、数字、短横线，建议 d- 开头）：", "d-");
    if (!id) return;
    if (!/^[A-Za-z0-9_-]+$/.test(id)) { status("id 只能包含字母、数字、短横线和下划线", "err"); return; }
    if (indexData.dishes.some((d) => d.id === id)) { status("这个 id 已经存在了", "err"); return; }
    const now = Date.now();
    const data = {
      id,
      title: "新菜谱",
      categoryId: "c-home",
      tags: "",
      aliases: "",
      difficulty: 2,
      durationMin: 0,
      servings: 2,
      notes: "",
      review: "",
      rating: 0,
      cookCount: 0,
      createdAt: now,
      updatedAt: now,
      ingredients: [],
      steps: [],
    };
    recipes.set(id, { data, sha: null, dirty: true, isNew: true });
    indexData.dishes.push({ id, title: data.title, updatedAt: now, deleted: false, sha: "" });
    await openRecipe(id);
    updateSaveBtn();
    status("新菜谱已在本地建好，编辑后记得保存", "ok");
  }

  /* ---------- 事件绑定 ---------- */

  $("#btnConnect").addEventListener("click", connect);
  $("#btnSaveAll").addEventListener("click", saveAll);
  $("#btnNew").addEventListener("click", newRecipe);
  $("#search").addEventListener("input", renderList);
  $("#list").addEventListener("click", (e) => {
    const item = e.target.closest("[data-open]");
    if (item) openRecipe(item.dataset.open);
  });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") {
      e.preventDefault();
      if (!$("#btnSaveAll").disabled) saveAll();
    }
  });

  // 回填上次填写的连接信息
  $("#token").value = cfg.token;
  $("#owner").value = cfg.owner;
  $("#repo").value = cfg.repo;
  // 上次填过令牌就自动连接，打开即可见菜谱列表
  if (cfg.token && cfg.owner && cfg.repo) connect();
})();
</script>
</body>
</html>
